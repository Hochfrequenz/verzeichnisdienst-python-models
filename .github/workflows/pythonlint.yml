name: "Linting"

on:
  push:
    branches: [main]
  pull_request: {}
jobs:
  pylint:
    name: Python Code Quality and Lint
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ["3.13"]
        os: [ubuntu-latest]
        linter-env: ["linting", "type_check", "spell_check"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }} and uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run ${{ matrix.linter-env }}
        run: |
          case "${{ matrix.linter-env }}" in
            linting)
              uv run --group linting ruff check --extend-exclude _autogenerated.py --extend-exclude _autogenerated_websocket.py src/verzeichnisdienst
              uv run --group linting ruff check unittests
              ;;
            type_check)
              uv run --group type_check mypy --show-error-codes src/verzeichnisdienst --strict
              uv run --group type_check mypy --show-error-codes unittests --strict
              ;;
            spell_check)
              uv run --group spell_check codespell --ignore-words=domain-specific-terms.txt src
              uv run --group spell_check codespell --ignore-words=domain-specific-terms.txt README.md
              ;;
          esac
